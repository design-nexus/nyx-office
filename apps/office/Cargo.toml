[package]
name = "nyx-office"
version = "0.1.0"
description = "Write, Sheets and Present: documents, spreadsheets and slides for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-office"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-office"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "4378e243aeb09733843996663cd9a5a7f0cbb821" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "40db521bab468d54f18f65c6aabd7fc8533d6a4d" }
anyhow = "1.0.104"
cairo-rs = { version = "0.22", features = ["pdf", "png", "v1_16"] }
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libspelling = "0.5"
pangocairo = "0.22"
pulldown-cmark = { version = "0.13", default-features = false }
roxmltree = "0.21"
rust_xlsxwriter = { version = "0.99", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sourceview5 = "0.11"
toml = "1.1.6"
zip = { version = "8", default-features = false, features = ["deflate"] }
